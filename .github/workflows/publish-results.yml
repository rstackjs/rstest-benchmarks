name: Publish results

# Manual only. Takes a finished benchmark run and updates the README, reports and
# charts on main from that run's artifacts. The script verifies the data and
# refuses unsuccessful, incomplete or partial runs; see docs/ci.md.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a successful Frameworks benchmark, Rstest coverage benchmark or Rstest version benchmark run
        type: string
        required: true
      dry_run:
        description: Regenerate and show the diff in the job summary without committing
        type: boolean
        default: false

permissions:
  contents: read

# Publications must not race each other when pushing to main.
concurrency:
  group: publish-results
  cancel-in-progress: false

jobs:
  publish:
    name: Publish run ${{ inputs.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      # The checkout token is kept so the script can push to main (a fast-forward;
      # it rebases once if main moved). Pushes made with GITHUB_TOKEN do not start
      # other workflows, and the benchmark workflows ignore report paths anyway.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
      - name: Publish run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            node scripts/publish-run.mjs --run "$RUN_ID" --dry-run
          else
            node scripts/publish-run.mjs --run "$RUN_ID" --push
          fi
