name: Probe cgroup memory

on:
  push:
    branches: [probe/cgroup-memory]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/probe-cgroup-memory.yml']

permissions:
  contents: read

jobs:
  probe:
    name: cgroup v2 memory.peak probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.1
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install benchmark dependencies
        run: pnpm --dir frameworks install --frozen-lockfile
      - name: Cgroup environment
        run: |
          cat /proc/self/cgroup
          mount | grep cgroup || true
          cat /sys/fs/cgroup/cgroup.controllers || true
          ls /usr/bin/time || sudo apt-get install -y time
          systemctl --version | head -1
      - name: Write probe scripts
        run: |
          mkdir -p /tmp/probe
          cat > /tmp/probe/prep.mjs <<'EOF_PREP'
          // CI variant of prep.mjs: materialize the harness workspaces under $GITHUB_WORKSPACE/results/ws.
          import { join } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const root = process.env.GITHUB_WORKSPACE
          const { generate, cases, frameworks } = await import(pathToFileURL(join(root, 'frameworks/fixtures.mjs')))
          const { configure } = await import(pathToFileURL(join(root, 'frameworks/configs.mjs')))
          const ws = join(root, 'results/ws')
          generate(ws, frameworks)
          for (const f of frameworks) for (const item of cases) configure(join(ws, 'workspaces', f, item.id), f, item)
          console.log('ok')

          EOF_PREP
          cat > /tmp/probe/sampler.mjs <<'EOF_SAMPLER'
          // Samples cgroup v2 memory.current + memory.stat (anon/file/shmem) every 10 ms; writes the series on SIGTERM.
          import { readFileSync, writeFileSync } from 'node:fs'
          const cg = '/sys/fs/cgroup' + readFileSync('/proc/self/cgroup', 'utf8').trim().split('\n').pop().split('::')[1] + '/'
          const t0 = process.hrtime.bigint()
          const rows = []
          const stat = () => {
            const o = {}
            for (const l of readFileSync(cg + 'memory.stat', 'utf8').split('\n')) { const [k, v] = l.split(' '); if (k === 'anon' || k === 'file' || k === 'shmem' || k === 'file_mapped') o[k] = Number(v) }
            return o
          }
          const tick = () => {
            const cur = Number(readFileSync(cg + 'memory.current', 'utf8'))
            rows.push([Number(process.hrtime.bigint() - t0) / 1e6, cur, stat()])
          }
          const timer = setInterval(tick, 10)
          const done = () => { clearInterval(timer); tick(); writeFileSync(process.argv[2], JSON.stringify(rows)); process.exit(0) }
          process.on('SIGTERM', done)
          process.send?.('ready')

          EOF_SAMPLER
          cat > /tmp/probe/measure.mjs <<'EOF_MEASURE'
          // Usage: node measure.mjs [--cwd DIR] [--workers-env VAR] -- command args...
          // Runs the command under /usr/bin/time -v inside this container's cgroup and prints one JSON line.
          import { spawn, spawnSync, fork } from 'node:child_process'
          import { readFileSync, mkdirSync, rmSync, readdirSync, existsSync } from 'node:fs'
          const argv = process.argv.slice(2)
          const sep = argv.indexOf('--')
          const opts = argv.slice(0, sep), cmd = argv.slice(sep + 1)
          const get = (k) => { const i = opts.indexOf(k); return i < 0 ? undefined : opts[i + 1] }
          const cwd = get('--cwd') ?? '/'
          const slotVar = get('--slot-var')
          const MiB = 1048576
          const cg = '/sys/fs/cgroup' + readFileSync('/proc/self/cgroup', 'utf8').trim().split('\n').pop().split('::')[1] + '/'
          if (get('--cold') === '1') for (const p of ['.cache', 'node_modules/.cache', 'node_modules/.vite', 'node_modules/.vite-temp', 'dist', '.rstest-results', 'coverage']) rmSync(`${cwd}/${p}`, { recursive: true, force: true })
          const env = { ...process.env, CI: 'true', NO_COLOR: '1', LC_ALL: 'C', NODE_DISABLE_COMPILE_CACHE: '1', RTL_SKIP_AUTO_CLEANUP: 'true' }
          rmSync('/tmp/m', { recursive: true, force: true }); mkdirSync('/tmp/m/workers', { recursive: true })
          env.FRAMEWORK_REPORT = '/tmp/m/counts.json'
          if (slotVar) { env.BENCH_WORKER_REPORT_DIR = '/tmp/m/workers'; env.BENCH_WORKER_SLOT_VARIABLE = slotVar }
          const sampler = fork(new URL('./sampler.mjs', import.meta.url).pathname, ['/tmp/m/series.json'])
          await new Promise((r) => sampler.once('message', r))
          const peak0 = Number(readFileSync(cg + 'memory.peak', 'utf8'))
          const start = Date.now()
          const child = spawn('/usr/bin/time', ['-v', '-o', '/tmp/m/time.txt', ...cmd], { cwd, env, stdio: ['ignore', 'ignore', 'ignore'] })
          const code = await new Promise((r) => child.on('exit', (c) => r(c)))
          const wallMs = Date.now() - start
          const peakAfter = Number(readFileSync(cg + 'memory.peak', 'utf8'))
          const statAfter = readFileSync(cg + 'memory.stat', 'utf8')
          sampler.kill('SIGTERM')
          await new Promise((r) => sampler.on('exit', r))
          const rows = JSON.parse(readFileSync('/tmp/m/series.json', 'utf8'))
          let maxCur = 0, maxAnon = 0, atPeak = null
          for (const [t, cur, s] of rows) { if (t > start - 0) {} ; if (cur > maxCur) { maxCur = cur; atPeak = s } ; if (s.anon > maxAnon) maxAnon = s.anon }
          const time = existsSync('/tmp/m/time.txt') ? readFileSync('/tmp/m/time.txt', 'utf8') : ''
          const maxrssKb = Number((time.match(/Maximum resident set size \(kbytes\): (\d+)/) ?? [])[1])
          let counts = null; try { counts = JSON.parse(readFileSync('/tmp/m/counts.json', 'utf8')) } catch {}
          let workers = null
          try { const ids = readdirSync('/tmp/m/workers').map((f) => JSON.parse(readFileSync('/tmp/m/workers/' + f, 'utf8'))); workers = { slots: new Set(ids.map((w) => w.slotId)).size, processes: new Set(ids.map((w) => w.pid)).size } } catch {}
          const stat = Object.fromEntries(statAfter.trim().split('\n').map((l) => l.split(' ')).map(([k, v]) => [k, Number(v)]))
          console.log(JSON.stringify({
            exit: code, wallMs,
            peakMiB: peakAfter / MiB, peakBeforeMiB: peak0 / MiB,
            sampledPeakMiB: maxCur / MiB, sampledPeakAnonMiB: maxAnon / MiB, anonAtPeakMiB: atPeak ? atPeak.anon / MiB : null, fileAtPeakMiB: atPeak ? atPeak.file / MiB : null, shmemAtPeakMiB: atPeak ? (atPeak.shmem ?? 0) / MiB : null,
            endAnonMiB: stat.anon / MiB, endFileMiB: stat.file / MiB, samples: rows.length,
            maxrssMiB: maxrssKb / 1024, counts: counts && { files: counts.files, tests: counts.tests, passed: counts.passed, failed: counts.failed }, workers,
          }))

          EOF_MEASURE
          node /tmp/probe/prep.mjs
      - name: Measure minimal-node inside a transient systemd scope (own cgroup)
        run: |
          NM="$GITHUB_WORKSPACE/frameworks/node_modules"
          WS="$GITHUB_WORKSPACE/results/ws/workspaces"
          run_in_scope() {
            sudo systemd-run --scope --quiet -p MemoryAccounting=yes --uid="$(id -u)" --gid="$(id -g)" \
              --setenv=PATH="$PATH" --setenv=HOME="$HOME" -- "$@"
          }
          echo "== idle (sleep 1)"
          run_in_scope node /tmp/probe/measure.mjs -- sleep 1
          for round in 1 2 3; do
            echo "== round $round"
            echo "jest:"
            run_in_scope node /tmp/probe/measure.mjs --cwd "$WS/jest/minimal-node" --cold 1 --slot-var JEST_WORKER_ID -- \
              node "$NM/jest/bin/jest.js" --config jest.config.cjs --maxWorkers=4
            echo "vitest:"
            run_in_scope node /tmp/probe/measure.mjs --cwd "$WS/vitest/minimal-node" --cold 1 --slot-var VITEST_POOL_ID -- \
              node "$NM/vitest/vitest.mjs" run --config vitest.config.mjs --maxWorkers=4
            echo "rstest:"
            run_in_scope node /tmp/probe/measure.mjs --cwd "$WS/rstest/minimal-node" --cold 1 --slot-var RSTEST_WORKER_ID -- \
              node "$NM/@rstest/core/bin/rstest.js" run --config rstest.config.mjs --pool.maxWorkers 4
          done
