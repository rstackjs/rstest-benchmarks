name: Probe cgroup memory

on:
  push:
    branches: [probe/cgroup-memory]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case: [minimal-node, minimal-react, startup, many-files, module-graph, backend, barrel, react]
    env:
      RUNS: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.1
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install benchmark dependencies
        run: pnpm --dir frameworks install --frozen-lockfile
      - name: Environment
        run: |
          cat /proc/self/cgroup; cat /sys/fs/cgroup/cgroup.controllers; nproc; free -m; node -v
          ls /usr/bin/time || sudo apt-get install -y time
          echo "ImageVersion=$ImageVersion"
      - name: Generate workspaces
        run: node .github/probe/prep.mjs
      - name: Measure ${{ matrix.case }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          node .github/probe/run-case.mjs "${{ matrix.case }}" "$RUNS" "$GITHUB_WORKSPACE/out/${{ matrix.case }}.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: memory-${{ matrix.case }}
          path: out/${{ matrix.case }}.jsonl
