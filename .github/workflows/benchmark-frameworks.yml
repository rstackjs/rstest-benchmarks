name: Frameworks benchmark

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'reports/**', 'frameworks/reports/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'reports/**', 'frameworks/reports/**']
  merge_group:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per case/cache condition (10 is optional for fuller order balancing)
        type: string
        default: '5'
      cases:
        description: Framework case IDs, comma-separated (empty runs all eight)
        type: string
      exclude_cases:
        description: Case IDs to exclude, comma-separated (applied after cases)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Benchmark
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.1
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Test harness
        run: pnpm test
      - name: Install benchmark dependencies and Chromium
        run: |
          pnpm --dir frameworks install --frozen-lockfile
          pnpm --dir frameworks exec playwright install --with-deps chromium
      # Keep all compared frameworks on one host, running sequentially.
      # Do not restore transform, build or sequencing caches across CI jobs.
      - name: Run benchmarks
        id: benchmark
        env:
          BENCH_RUNS: ${{ inputs.runs || '5' }}
          BENCH_EXCLUDE_CASES: ${{ inputs.exclude_cases }}
          BENCH_CASES: ${{ inputs.cases || 'minimal-node,minimal-react,startup,many-files,module-graph,backend,barrel,react' }}
        shell: bash
        run: |
          pnpm compare:frameworks --suites main,browser --frameworks jest,vitest,vitest-vmForks,rstest,rstest-vmForks --cases "$BENCH_CASES" --exclude-cases "$BENCH_EXCLUDE_CASES" --runs "$BENCH_RUNS" --label ci-frameworks
      - name: Publish job summary
        if: always()
        env:
          RESULT_DIR: ${{ steps.benchmark.outputs.result-directory }}
        shell: bash
        run: |
          if [[ -n "$RESULT_DIR" && -f "$RESULT_DIR/summary.md" ]]; then
            cat "$RESULT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload samples, reports and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-frameworks-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            !results/**/node_modules/**
            !results/**/.cache/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Check published reports
        if: always()
        run: pnpm report:frameworks:check
