name: Rstest version benchmarks

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner OS (results from different hosts must not be pooled)
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04
      runs:
        description: Timed runs per case (use a multiple of the number of versions)
        type: string
        default: '6'
      baseline:
        description: Rstest baseline npm version
        type: string
        default: '0.11.0'
      candidate:
        description: Rstest candidate npm version(s), comma-separated
        type: string
        default: '0.12.6'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.1
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Check harness and published reports
        run: |
          pnpm test
          pnpm report:check
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        run: |
          PLAYWRIGHT_VERSION="$(node -p 'require("./apps/react-spa/package.json").devDependencies.playwright')"
          pnpm dlx "playwright@$PLAYWRIGHT_VERSION" install-deps chromium
      # compare installs each version in an isolated workspace, including Chromium.
      # Compared versions run sequentially on one host with runner-managed caches.
      - name: Run benchmarks
        id: benchmark
        env:
          BENCH_RUNS: ${{ inputs.runs || '6' }}
          BENCH_BASELINE: ${{ inputs.baseline || '0.11.0' }}
          BENCH_CANDIDATE: ${{ inputs.candidate || '0.12.6' }}
        shell: bash
        run: |
          pnpm compare --baseline "$BENCH_BASELINE" --candidate "$BENCH_CANDIDATE" --suites all --runs "$BENCH_RUNS" --label ci-versions
      - name: Publish job summary
        if: always()
        env:
          RESULT_DIR: ${{ steps.benchmark.outputs.result-directory }}
        shell: bash
        run: |
          if [[ -z "$RESULT_DIR" ]]; then exit 0; fi
          for report in "$RESULT_DIR"/reports/*.md; do
            if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload samples, reports and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-versions-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            !results/**/node_modules/**
            !results/**/.cache/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
