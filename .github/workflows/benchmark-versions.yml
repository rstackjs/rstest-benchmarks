name: Rstest version benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per case (use a multiple of the number of versions)
        type: string
        default: '6'
      baseline:
        description: Baseline npm version or commit-addressed pkg.pr.new Rstest link
        type: string
        default: '0.12.6'
      candidate:
        description: Candidate npm versions or pkg.pr.new Rstest links, comma-separated
        type: string
        default: '1.0.0-beta.0'
      memory:
        description: Measure peak process-tree footprint in a separate pass
        type: boolean
        default: true
      suites:
        description: Suites to run, comma-separated (default main,scaling,pools; barrel is optional)
        type: string
        default: 'main,scaling,pools'
      cases:
        description: App names or full case IDs, comma-separated (empty runs all)
        type: string
      exclude_cases:
        description: Case IDs to exclude, comma-separated (applied after cases)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Split suites and heavy/browser workloads into parallel matrix jobs so each
  # job stays short and only browser units install Chromium. Every unit runs all
  # compared versions sequentially on one host.
  setup:
    name: Plan matrix
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Test harness
        run: pnpm test
      - name: Plan matrix
        id: plan
        env:
          BENCH_SUITES: ${{ inputs.suites || 'main,scaling,pools' }}
          BENCH_CASES: ${{ inputs.cases }}
          BENCH_EXCLUDE_CASES: ${{ inputs.exclude_cases }}
        run: node scripts/ci-matrix.mjs versions --suites "$BENCH_SUITES" --cases "$BENCH_CASES" --exclude-cases "$BENCH_EXCLUDE_CASES"

  benchmark:
    name: Benchmark (${{ matrix.name }})
    needs: setup
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      # compare installs each version in an isolated workspace, including Chromium when needed.
      # Compared versions run sequentially on one host with runner-managed caches.
      - name: Run benchmarks
        id: benchmark
        env:
          BENCH_MEMORY: ${{ inputs.memory }}
          BENCH_SUITE: ${{ matrix.suite }}
          BENCH_CASE: ${{ matrix.cases }}
          BENCH_RUNS: ${{ inputs.runs || '6' }}
          BENCH_BASELINE: ${{ inputs.baseline || '0.12.6' }}
          BENCH_CANDIDATE: ${{ inputs.candidate || '1.0.0-beta.0' }}
        shell: bash
        run: |
          args=()
          if [[ "$BENCH_MEMORY" != "false" ]]; then args+=(--memory); fi
          pnpm compare "${args[@]}" --baseline "$BENCH_BASELINE" --candidate "$BENCH_CANDIDATE" --suites "$BENCH_SUITE" --cases "$BENCH_CASE" --runs "$BENCH_RUNS" --label ci-versions
      - name: Publish job summary
        if: always()
        env:
          RESULT_DIR: ${{ steps.benchmark.outputs.result-directory }}
        shell: bash
        run: |
          if [[ -n "$RESULT_DIR" && -f "$RESULT_DIR/summary.md" ]]; then
            cat "$RESULT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload samples, reports and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-version-case-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            !results/**/node_modules/**
            !results/**/.cache/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  merge:
    name: Merge results
    needs: [setup, benchmark]
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Download unit artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: case-results
          pattern: benchmark-version-case-*-${{ github.run_id }}-${{ github.run_attempt }}
      # Refuses inputs whose versions, options, host, harness or lockfile differ.
      - name: Merge unit comparisons
        id: merge
        shell: bash
        run: node scripts/merge-comparisons.mjs --output "results/ci-versions-merged-${GITHUB_RUN_ID}" case-results/*
      - name: Publish job summary
        if: always()
        env:
          RESULT_DIR: ${{ steps.merge.outputs.result-directory }}
        shell: bash
        run: |
          if [[ -n "$RESULT_DIR" && -f "$RESULT_DIR/summary.md" ]]; then
            cat "$RESULT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload merged samples and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-versions-merged-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Check published reports
        if: always()
        run: pnpm report:check
