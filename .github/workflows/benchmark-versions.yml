name: Rstest version benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per case (use a multiple of the number of versions)
        type: string
        default: '6'
      baseline:
        description: Rstest baseline npm version
        type: string
        default: '0.11.0'
      candidate:
        description: Rstest candidate npm version(s), comma-separated
        type: string
        default: '0.12.6'
      suites:
        description: Suites to run, comma-separated (main matches the README; scaling,barrel,pools are optional)
        type: string
        default: main
      cases:
        description: App names or full case IDs, comma-separated (empty runs all)
        type: string
      exclude_cases:
        description: Case IDs to exclude, comma-separated (applied after cases)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.1
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Test harness
        run: pnpm test
      # compare installs each version in an isolated workspace, including Chromium.
      # Compared versions run sequentially on one host with runner-managed caches.
      - name: Run benchmarks
        id: benchmark
        env:
          BENCH_SUITES: ${{ inputs.suites || 'main' }}
          BENCH_RUNS: ${{ inputs.runs || '6' }}
          BENCH_CASES: ${{ inputs.cases }}
          BENCH_EXCLUDE_CASES: ${{ inputs.exclude_cases }}
          BENCH_BASELINE: ${{ inputs.baseline || '0.11.0' }}
          BENCH_CANDIDATE: ${{ inputs.candidate || '0.12.6' }}
        shell: bash
        run: |
          pnpm compare --baseline "$BENCH_BASELINE" --candidate "$BENCH_CANDIDATE" --suites "$BENCH_SUITES" --cases "$BENCH_CASES" --exclude-cases "$BENCH_EXCLUDE_CASES" --runs "$BENCH_RUNS" --label ci-versions
      - name: Publish job summary
        if: always()
        env:
          RESULT_DIR: ${{ steps.benchmark.outputs.result-directory }}
        shell: bash
        run: |
          if [[ -n "$RESULT_DIR" && -f "$RESULT_DIR/summary.md" ]]; then
            cat "$RESULT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload samples, reports and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-versions-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            !results/**/node_modules/**
            !results/**/.cache/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Check published reports
        if: always()
        run: pnpm report:check
