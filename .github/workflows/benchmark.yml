name: Benchmark

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'reports/**', 'frameworks/reports/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'reports/**', 'frameworks/reports/**']
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: Comparison to run
        type: choice
        options: [frameworks, versions]
        default: frameworks
      runner:
        description: Runner OS (results from different hosts must not be pooled)
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04
      runs:
        description: Timed runs (multiples of 8 balance the default framework comparison)
        type: string
        default: '8'
      cases:
        description: Framework case IDs, comma-separated (empty runs all eight)
        type: string
      baseline:
        description: Rstest baseline npm version (versions mode only)
        type: string
        default: '0.11.0'
      candidate:
        description: Rstest candidate npm version(s), comma-separated (versions mode only)
        type: string
        default: '0.12.6'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.1
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Check harness and published reports
        run: |
          pnpm test
          pnpm report:check
          pnpm report:frameworks:check
      - name: Install benchmark dependencies and Chromium
        run: |
          pnpm --dir frameworks install --frozen-lockfile
          pnpm --dir frameworks exec playwright install --with-deps chromium
      # Keep all compared frameworks/versions on one host, running sequentially.
      # Do not restore transform, build or sequencing caches across CI jobs.
      - name: Run benchmarks
        id: benchmark
        env:
          BENCH_MODE: ${{ inputs.mode || 'frameworks' }}
          BENCH_RUNS: ${{ inputs.runs || '8' }}
          BENCH_CASES: ${{ inputs.cases || 'minimal-node,minimal-react,startup,many-files,module-graph,backend,barrel,react' }}
          BENCH_BASELINE: ${{ inputs.baseline || '0.11.0' }}
          BENCH_CANDIDATE: ${{ inputs.candidate || '0.12.6' }}
        shell: bash
        run: |
          if [[ "$BENCH_MODE" == versions ]]; then
            pnpm compare --baseline "$BENCH_BASELINE" --candidate "$BENCH_CANDIDATE" --suites all --runs "$BENCH_RUNS" --label ci-versions
          else
            pnpm compare:frameworks --frameworks jest,vitest,rstest,rstest-vmForks --cases "$BENCH_CASES" --runs "$BENCH_RUNS" --label ci-frameworks
          fi
      - name: Publish job summary
        if: always()
        env:
          RESULT_DIR: ${{ steps.benchmark.outputs.result-directory }}
        shell: bash
        run: |
          if [[ -z "$RESULT_DIR" ]]; then exit 0; fi
          for report in "$RESULT_DIR/report.md" "$RESULT_DIR"/reports/*.md; do
            if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload samples, reports and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ inputs.mode || 'frameworks' }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            !results/**/node_modules/**
            !results/**/.cache/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
